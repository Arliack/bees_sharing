<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partage d'essaims 🐝</title>

  <!-- Google Font DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Styles du projet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1><span class="emoji">🐝</span> Partage d'essaims</h1>
    <a href="deposer.html" class="btn-header">+ Signaler un essaim</a>
  </header>

  <!-- Bandeau stats saison -->
  <div id="stats-barre">
    <span>🌸 Cette saison : <strong id="stat-saison">…</strong> essaims signalés</span>
    <span>✅ <strong id="stat-recuperes">…</strong> récupérés</span>
    <span>🐝 <strong id="stat-disponibles">…</strong> disponibles</span>
  </div>

  <div id="zone-carte">
    <!-- Barre de filtre -->
    <div id="barre-filtre">
      <label for="filtre-dept">Département :</label>
      <select id="filtre-dept" aria-label="Filtrer par département">
        <option value="">Tous</option>
      </select>

      <label for="filtre-ville">Ville :</label>
      <div class="autocomplete-wrapper">
        <input
          type="text"
          id="filtre-ville"
          placeholder="ex : Bordeaux…"
          aria-label="Filtrer par ville"
          autocomplete="off"
        />
        <ul id="ville-suggestions" class="autocomplete-liste" hidden role="listbox"></ul>
      </div>

      <button
        id="btn-alerte"
        class="btn-alerte"
        type="button"
        aria-expanded="false"
        aria-controls="panneau-abonnement"
        onclick="basculerPanneauAbonnement()"
      >🔔 M'alerter</button>
      <span id="compteur">Chargement…</span>
    </div>

    <!-- Panneau d'abonnement (masqué par défaut) -->
    <div id="panneau-abonnement" class="panneau-abonnement" hidden>
      <p class="abonne-intro">
        Recevez un email dès qu'un essaim est signalé dans votre département.
      </p>
      <form id="form-abonnement" class="abonne-form" novalidate>
        <input
          type="email"
          id="abonne-email"
          placeholder="votre@email.fr"
          autocomplete="email"
          required
          aria-label="Votre adresse email"
        />
        <select id="abonne-dept" required aria-label="Département à surveiller">
          <option value="">Choisir un département…</option>
        </select>
        <button type="submit" id="btn-form-abonnement">M'alerter</button>
      </form>
      <div id="abonne-message" role="status" aria-live="polite"></div>
    </div>

    <!-- Carte Leaflet -->
    <div id="carte" role="application" aria-label="Carte des essaims disponibles"></div>
  </div>

  <!-- Bottom-sheet (mobile) -->
  <div id="bs-overlay" hidden onclick="fermerBottomSheet()"></div>
  <div id="bottom-sheet" hidden>
    <div class="bs-handle" onclick="fermerBottomSheet()"></div>
    <div id="bs-contenu"></div>
  </div>

  <!-- Bouton flottant -->
  <a href="deposer.html" id="btn-signaler" aria-label="Signaler un essaim">
    🐝 Signaler un essaim
  </a>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Scripts du projet -->
  <script src="js/config.js"></script>
  <script src="js/carte.js"></script>
  <script src="js/annonces.js"></script>
  <script src="js/abonnements.js"></script>

  <script>
    // Point d'entrée : initialise la carte puis charge les annonces
    document.addEventListener('DOMContentLoaded', () => {
      initialiserCarte();
      chargerEssaims();
    });
  </script>
</body>
</html>
